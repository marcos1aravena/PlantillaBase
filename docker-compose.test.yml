name: base-app-tests
services:
  postgres-tests:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: base_app_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d base_app_test"]
      interval: 2s
      timeout: 3s
      retries: 30
