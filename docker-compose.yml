services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base_app}
      POSTGRES_USER: ${POSTGRES_USER:-base_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base_user} -d ${POSTGRES_DB:-base_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_LOCALE: ${APP_LOCALE:-es}
      DATABASE_URL: postgresql://${POSTGRES_USER:-base_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-base_app}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS:-10}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-300}
      AUTH_BLOCK_SECONDS: ${AUTH_BLOCK_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Superadministrador}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?Set SEED_SUPERADMIN_EMAIL in .env}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?Set SEED_SUPERADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  postgres_data:
