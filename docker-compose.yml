services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base_app}
      POSTGRES_USER: ${POSTGRES_USER:-base_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base_user} -d ${POSTGRES_DB:-base_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-base_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-base_app}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    restart: "no"
    command: ["node", "dist/prisma/seed.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-base_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-base_app}?schema=public
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Superadministrador}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_LOCALE: ${APP_LOCALE:-es}
      DATABASE_URL: postgresql://${POSTGRES_USER:-base_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-base_app}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS:-10}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-300}
      AUTH_BLOCK_SECONDS: ${AUTH_BLOCK_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT || '4000')+'/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "3000:3000"
volumes:
  postgres_data:
